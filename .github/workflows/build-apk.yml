name: Build APKs

# Builds a debug APK for `main` and for every feature branch, then attaches
# all of them to a single tagged GitHub Release (permanent download URLs)
# in addition to per-branch run artifacts.
#
# A single workflow on `main` uses a matrix to check out each branch by ref,
# so the feature branches do not need to carry this file themselves.
#
# How to get the APKs:
#   - Run manually: Actions tab -> "Build APKs" -> "Run workflow"
#     (also runs automatically on every push to main).
#   - Permanent: Releases page -> the "AI Proxy Gateway APKs - build #<n>"
#     release -> download app-debug-<branch>.apk from the assets list.
#   - Transient backup: the run's Artifacts section (apk-<branch>, 30 days).
#
# Repo-specific build prerequisites (handled in the steps below):
#   - No Gradle wrapper is committed, so Gradle is provisioned via
#     gradle/actions/setup-gradle (gradle-version pinned below).
#   - AGP 9.1.1 requires JDK 17 to run and Gradle 9.x.
#   - The debug signingConfig points at ${rootDir}/debug.keystore, committed
#     only as base64 (debug.keystore.base64) -> we decode it.
#   - The `secrets` Gradle plugin reads .env and falls back to .env.example
#     (ships a GEMINI_API_KEY placeholder), so a debug build needs no real
#     secret; we copy it to .env if .env is absent.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag for the APK release (blank = apks-build-<run#>)"
        required: false
        default: ""
  push:
    branches: [ main ]

# Read-only by default; only the release job is granted contents: write.
permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.branch }})
    runs-on: ubuntu-latest
    strategy:
      # One branch failing must not cancel the rest — we still want every
      # buildable branch to produce its APK.
      fail-fast: false
      matrix:
        branch:
          - main
          # PR #1-#3 (chain to main)
          - litert-lm-real-inference
          - routing-correctness
          - housekeeping-and-minor-features
          # PR #4-#6 (stacked)
          - feat-npu-opt-in
          - feat-litertlm-kv-cache-reuse
          - feat-sse-streaming
          # PR #7-#12 (parallel, branch off feat-sse-streaming)
          - feat-multimodal-data-uris-v2
          - feat-per-model-provider
          - feat-tools-501-gate
          - feat-aicore-scaffold
          - feat-streaming-wiring
          - feat-applicationid-trim

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 9.1.1 requires Gradle 9.x. Adjust here if CI reports an
          # incompatible-version error on the first run.
          gradle-version: '9.1.0'

      - name: Prepare .env (fall back to committed .env.example)
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
            echo "Copied .env.example -> .env"
          fi

      - name: Decode debug keystore
        run: |
          base64 -d debug.keystore.base64 > debug.keystore
          echo "Decoded debug.keystore ($(wc -c < debug.keystore) bytes)"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK with branch-tagged name
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/app-debug-${{ matrix.branch }}.apk"
          ls -la out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.branch }}
          path: out/app-debug-${{ matrix.branch }}.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach all APKs to a GitHub Release
    needs: build
    # Run even if some matrix legs failed, so we still publish whatever built.
    # Don't run if the whole workflow was cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: apk-*
          merge-multiple: true

      - name: List downloaded APKs
        run: ls -la dist/ || echo "(no APKs were produced)"

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=apks-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        run: |
          {
            echo "Debug APKs built from \`main\` and all feature branches."
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Workflow run: #${{ github.run_number }}"
            echo ""
            echo "## APKs in this release"
            shopt -s nullglob
            count=0
            for f in dist/*.apk; do
              echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"
              count=$((count+1))
            done
            if [ "$count" -eq 0 ]; then
              echo "_No APKs were produced — all matrix builds failed. Check the build jobs._"
            fi
          } > release-notes.md
          echo "---- release-notes.md ----"
          cat release-notes.md

      - name: Create / update Release with all APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "AI Proxy Gateway APKs - build #${{ github.run_number }}"
          body_path: release-notes.md
          files: dist/*.apk
          fail_on_unmatched_files: false
